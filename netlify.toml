# Cavalli Estates — static site + serverless functions
[build]
  publish = "."

# ---------- client preview links (El Valle Marketing) ----------
# Production (main) has no build step. Branch deploys and Deploy Previews
# write a _headers file so preview links stay out of search results.
# The branch named "cavalli" is the client preview, served at
# cavalli.preview.<agency domain> once the Netlify domain step is done.
[context.branch-deploy]
  command = "printf '/*\\n  X-Robots-Tag: noindex, nofollow\\n' > _headers"

[context.deploy-preview]
  command = "printf '/*\\n  X-Robots-Tag: noindex, nofollow\\n' > _headers"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- security headers (baseline + CSP) ----------
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self' blob: data:; frame-src https://www.google.com; connect-src 'self' https://*.myshopify.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[[redirects]]  # security: hide non-web file
  from = "/QUESTIONS.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]  # security: hide non-web file
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

# Vineyard page became the Tasting Room
[[redirects]]
  from = "/vineyard.html"
  to = "/tasting-room.html"
  status = 301

[[redirects]]
  from = "/vineyard"
  to = "/tasting-room.html"
  status = 301

[[redirects]]  # security: shop build files stay in the repo, not on the web
  from = "/shop-data/*"
  to = "/404.html"
  status = 404
  force = true
